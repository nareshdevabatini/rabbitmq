services:
  employeeservice:
    image: ${DOCKER_REGISTRY-}employeeservice
    build:
      context: .
      dockerfile: Services/EmployeeService/Dockerfile
    depends_on:
      - distributedcache

  productservice:
    image: ${DOCKER_REGISTRY-}productservice
    build:
      context: .
      dockerfile: Services/ProductService/Dockerfile
    depends_on:
      - distributedcache

  distributedcache:
    image: redis:latest
    container_name: distributedcache
    restart: always

  messagebroker:
    image: rabbitmq:management